services:
  taskmaster:
    container_name: taskmaster
    build: .
    ports:
      - "8000:4000"
    restart: unless-stopped
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account
    secrets:
      - google-service-account
    volumes:
      - taskmaster:/app/files

secrets:
  google-service-account:
    file: ./back/files/service-account.json

volumes:
  taskmaster:
