name: CI

on:
  push:
    branches:
      - "main"

env:
  NODE_VERSION: 24.22.1

jobs:
  check-types-back:
    name: Check Types (back)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies (No Lifecycle Scripts)
        run: cd back && npm install
      - name: Check Types
        run: cd back && npm run ts

  lint-back:
    name: Run Linter (back)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}
      - name: Install Dependencies (No Lifecycle Scripts)
        run: cd back && npm install
      - name: Run Linter
        run: cd back && npm run lint

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [check-types-back, lint-back]
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: ~/taskmaster/deploy_taskmaster.sh
